name: iDrivePulseCompanion
options:
  bundleIdPrefix: com.idrivepulse
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  iDrivePulseCompanion:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - target: FileProviderExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idrivepulse.companion
        PRODUCT_NAME: iDrivePulse Companion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleDisplayName: iDrivePulse
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
  FileProviderExtension:
    type: app-extension
    platform: iOS
    sources:
      - FileProvider
    info:
      path: Configuration/FileProvider-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.idrivepulse.companion.files
        PRODUCT_NAME: iDrivePulse Files
        CODE_SIGN_ENTITLEMENTS: Configuration/FileProvider.entitlements
        SKIP_INSTALL: YES
