<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/pocketdock-icon-192.png" type="image/png" />
    <link rel="stylesheet" href="/mobile.css" />
    <title>PocketDock File Request</title>
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <header>
      <div class="brand"><img src="/pocketdock-logo.png" alt="PocketDock" /></div>
      <div class="connection-indicator online"><span></span><em>Private request</em></div>
    </header>
    <main class="private-share-main">
      <section class="pair-card private-share-card request-card">
        <div class="pair-icon request-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12"></path><path d="m7 8 5-5 5 5"></path>
            <path d="M5 14v5h14v-5"></path>
          </svg>
        </div>
        <span class="eyebrow">Direct to PocketDock</span>
        <h1 id="request-title">Opening file request…</h1>
        <p id="request-detail">Files travel directly to the requesting PC.</p>
        <label class="request-picker" for="request-files">
          <strong>Choose files</strong>
          <span id="request-limits">Checking request limits…</span>
          <input id="request-files" type="file" multiple />
        </label>
        <div class="request-queue" id="request-queue"></div>
        <button class="primary-button" id="request-send" disabled>Send to PC</button>
        <div class="form-error" id="request-error" role="alert"></div>
        <p class="request-privacy">PocketDock does not require an account or cloud storage. Use a paired PocketDock transfer when application-layer AES-256 encryption is required.</p>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <script src="/request.js" defer></script>
  </body>
</html>
