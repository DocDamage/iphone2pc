<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/pocketdock-icon-192.png" type="image/png" />
    <link rel="stylesheet" href="/mobile.css" />
    <title>Private PocketDock Share</title>
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <header>
      <div class="brand">
        <img src="/pocketdock-logo.png" alt="PocketDock" />
      </div>
      <div class="connection-indicator online"><span></span><em>Private link</em></div>
    </header>
    <main class="private-share-main">
      <section class="pair-card private-share-card">
        <div class="pair-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <span class="eyebrow">End-to-end encrypted</span>
        <h1 id="share-title">Opening private share…</h1>
        <p id="share-detail">The decryption key stays in this link’s private fragment.</p>
        <section class="delivery-panel" id="delivery-panel" hidden>
          <div class="delivery-meta" id="delivery-meta"></div>
          <div class="delivery-tracks" id="delivery-tracks"></div>
          <textarea id="delivery-note" placeholder="Timestamped notes or approval message…"></textarea>
          <div class="delivery-actions">
            <button class="primary-button" id="delivery-approve">Approve delivery</button>
            <button class="request-change-button" id="delivery-changes">Request changes</button>
          </div>
        </section>
        <div class="download-list private-download-list" id="private-files"></div>
        <div class="form-error" id="share-error" role="alert"></div>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <script src="/mobile-crypto.js" defer></script>
    <script src="/share.js" defer></script>
  </body>
</html>
