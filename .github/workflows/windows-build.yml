name: PocketDock Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify PocketDock
        run: npm run verify

      - name: Verify native iOS source
        run: npm run verify:ios

      - name: Verify hardware integration readiness
        run: npm run verify:hardware

      - name: Verify private relay
        run: npm run verify:relay

      - name: Smoke-test private relay
        run: npm --prefix relay test

      - name: Audit build toolchain
        run: npm run verify:build-tools
