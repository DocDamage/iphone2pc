    <!-- AUDIO PLAYER BAR (Fixed bottom) -->
    <div id="audioPlayerBar" class="audio-player-bar is-idle">
        <!-- Track Info -->
        <div class="player-info">
            <div class="album-art-ph">
                <i class="fa-solid fa-music"></i>
            </div>
            <div style="min-width: 0;">
                <div id="playerTitle" class="player-title-text">No track selected</div>
                <div id="playerArtist" class="player-artist-text">Click play on any beat to listen</div>
            </div>
        </div>

        <!-- Playback Controls -->
        <div class="player-controls">
            <button class="player-ctrl-btn" onclick="prevTrack()" title="Previous (←)" aria-label="Previous track">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button id="btnPlayPause" class="player-ctrl-btn play-pause" onclick="togglePlayPause()" title="Play/Pause (Space)" aria-label="Play or pause">
                <i class="fa-solid fa-play"></i>
            </button>
            <button class="player-ctrl-btn" onclick="nextTrack()" title="Next (→)" aria-label="Next track">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>

        <!-- Progress Bar -->
        <div class="player-progress-section">
            <div class="player-progress-times">
                <span id="playerCurrentTime">0:00</span>
                <span id="playerTotalTime">0:00</span>
            </div>
            <div class="player-progress-track" id="playerProgressTrack" onclick="seekTrack(event)">
                <div id="playerProgressFill" class="player-progress-fill"></div>
            </div>
        </div>

        <!-- Volume -->
        <div class="player-volume-section">
            <i class="fa-solid fa-volume-high" id="volumeIcon" onclick="toggleMute()"></i>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1" oninput="changeVolume(this.value)">
        </div>

        <!-- Visualizer & Extras -->
        <div class="player-extras">
            <canvas id="visualizerCanvas" width="120" height="36"></canvas>
            <select id="playbackSpeedSelect" class="input-field" style="width: 70px; padding: 4px 6px; font-size: 11px;" onchange="changePlaybackSpeed(this.value)">
                <option value="0.75">0.75x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2.0">2.0x</option>
            </select>
            <button id="playerCollapseButton" class="player-ctrl-btn player-collapse" type="button" onclick="togglePlayerBar()" aria-label="Collapse audio player" title="Collapse player"><i class="fa-solid fa-chevron-down"></i></button>
        </div>

        <!-- Hidden audio element -->
        <audio id="audioElement" preload="auto"></audio>
    </div>
